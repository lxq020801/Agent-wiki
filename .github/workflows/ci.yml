name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      AGENT_WIKI_HOME: /tmp/agent-wiki-ci
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPYCACHEPREFIX: /tmp/agent-wiki-pycache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            deps/douyin/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r deps/douyin/requirements.txt

      - name: Compile Python entry points
        run: python -m compileall -q install server scripts deps/douyin/scripts

      - name: Run P0 static checks
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: python tests/test_p0_static.py

      - name: Run complete Python unittest suite
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run release audit checks
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: |
          python scripts/release_audit.py
          python scripts/release_audit.py --history

      - name: Check Chrome extension JavaScript
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/runtime-version.js
          node --check chrome-extension/popup/popup.js
          node --check chrome-extension/content/douyin-current-video.js

      - name: Run complete extension test suite
        run: |
          node tests/test_douyin_current_video_title.js
          node tests/test_extension_runtime_version.js
          node tests/test_extension_contract.js
          node tests/test_first_run_onboarding.js
          node tests/test_github_extension_contract.js
          node tests/test_popup_ui_contract.js
